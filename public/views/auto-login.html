<style>body { background-color: #000; }</style>
<script>
  (function() {
    var redirectTo;

    function main() {
      var qs = getUrlParams();

      // If URL params other than "t" are specified make sure to keep track of
      // them to add them to redirectTo.  All instances of a dollar sign
      // followed by another character will be replaced with just the character
      // that followed (eg. "$$money" will become "$money" while "$t" will
      // become "t").  The dollar sign notation makes it possible to pass a "t"
      // param to the redirected page.
      let additionalQS = "";
      const qsKeys = Object.keys(qs);
      if (qsKeys.length > (qsKeys.includes('t') ? 1 : 0)) {
        for (const qsKey of qsKeys) {
          // Keep track of all aditional params that are not the "t" param.
          if (qsKey !== 't') {
            additionalQS += (additionalQS ? '&' : '?')
              + encodeURIComponent(qsKey.replace(/\$(.)/g, '$1'))
              + `=${encodeURIComponent(qs[qsKey])}`;
          }
        }
      }
      additionalQS = additionalQS.replace(/%20/g, '+');

      if (qs.t) {
        var tData = JSON.parse(atob(qs.t));
        redirectTo = tData && (tData.redirect || tData.r);
        postJSON(
          '/login',
          { user: tData.user || tData.u, password: tData.pass || tData.p },
          function(responseText, xhr) {
            try {
              var jsonResponse = JSON.parse(responseText);
              if (jsonResponse.error) {
                throw new Error(jsonResponse.error);
              }
              setCookie('redirect_to', null, -99999);
              location.href = dedupeUrlParams(
                ((redirectTo || '/') + additionalQS).replace(/\?/g, '&').replace('&', '?')
              );
            }
            catch (e) {
              console.error(e);
              logout(additionalQS);
            }
          }
        );
      }
      else {
        logout(additionalQS);
      }
    }

    /**
     * @param {string} additionalQS
     */
    function logout(additionalQS) {
      setCookie(
        'redirect_to',
        dedupeUrlParams(
          ((redirectTo || '/') + additionalQS).replace(/\?/g, '&').replace('&', '?')
        )
      );
      location.href = '/logout';
    }

    /**
     * Removes duplicate URL params by just keeping the last one.
     * @param {string} url
     * @returns {string}
     */
    function dedupeUrlParams(url) {
      return url.replace(
        /\?([^#]*)(?=#|$)/,
        /**
         * @param {string} m
         * @param {string} qs
         */
        (m, qs) => {
          if (qs) {
            const strPairs = qs.split('&');
            /** @type {{[k: string]: string}} */
            const strPairsByKey = strPairs.reduce(
              (strPairsByKey, strPair) => Object.assign(
                strPairsByKey,
                {[strPair.split("=", 1)[0]]: strPair}
              ),
              {}
            );
            m = '';
            for (const strPair of Object.values(strPairsByKey)) {
              m += `${m ? '&' : '?'}${strPair}`;
            }
          }
          return m;
        }
      );
    }

    function getUrlParams() {
      var params = {};
      location.search.replace(/\+/g, ' ').replace(/[\?&]([^=&]+)=([^&]*)/g, function(m, key, value) {
        params[decodeURIComponent(key)] = decodeURIComponent(value);
      });
      return params;
    }

    function setCookie(name, value, time) {
      var today = new Date(),
          offset = (typeof time == 'undefined') ? (1000 * 60 * 60 * 24) : (time * 1000),
          expiresAt = new Date(today.getTime() + offset);

      var cookieValues = {
        name: encodeURIComponent(name),
        value: encodeURIComponent([value].toString()),
        expires: expiresAt.toGMTString()
      };
      var cookie = '@name=@value;expires=@expires;path=/;samesite=none;secure'.replace(
        /@(\w+)/g,
        function(m, key) {
          return cookieValues[key];
        }
      );
      document.cookie = cookie;
    }

    function postJSON(url, data, callback) {
      var xhr = new XMLHttpRequest();
      xhr.withCredentials = true;
      xhr.addEventListener("readystatechange", function() {
        if(xhr.readyState === 4) {
          callback(this.responseText, xhr);
        }
      });
      xhr.open("POST", url);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.send(JSON.stringify(data));
    }

    main();
  })();
</script>
